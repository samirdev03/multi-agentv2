spring.datasource.url=jdbc:sqlite:./data/agent-runtime.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update

telegram.connector.base-url=${TELEGRAM_CONNECTOR_BASE_URL:http://telegram-connector:8080}

provider.providers.openrouter.provider=OpenRouter
provider.providers.openrouter.base-url=https://openrouter.ai/api/v1
provider.providers.openrouter.api-key=${OPENROUTER_API_KEY}

# Spring AI Auto-Konfiguration deaktivieren,
# da du OpenAiChatModel selbst mit deinem CredentialRegistry erzeugst
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none

spring.ai.chat.client.enabled=false