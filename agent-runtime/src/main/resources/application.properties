spring.datasource.url=jdbc:sqlite:./data/agent-runtime.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update

telegram.connector.base-url=${TELEGRAM_CONNECTOR_BASE_URL:http://telegram-connector:8080}
callback.allowed-base-urls=${CALLBACK_ALLOWED_BASE_URL:http://telegram-connector:8080}
callback.connector-token=${CONNECTOR_CALLBACK_TOKEN}

provider.providers.openrouter.provider=OpenRouter
provider.providers.openrouter.base-url=https://openrouter.ai/api/v1
provider.providers.openrouter.api-key=${OPENROUTER_API_KEY}

# Spring AI Auto-Konfiguration deaktivieren,
# da du OpenAiChatModel selbst mit deinem CredentialRegistry erzeugst
spring.ai.model.chat=none
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none

spring.ai.chat.client.enabled=false

# Spring Shell is enabled explicitly with --spring.profiles.active=cli
spring.shell.interactive.enabled=false

# Tool Properties
tools.files.path=${TOOLS_FILES_PATH:./agent/ai/files}
tools.http.max-bytes=${TOOLS_HTTP_MAX_BYTES:1000000}
tools.http.timeout-seconds=${TOOLS_HTTP_TIMEOUT_SECONDS:10}
tools.files.max-size-bytes=${FILE_ATTACHMENT_MAX_SIZE_BYTES:10485760}

