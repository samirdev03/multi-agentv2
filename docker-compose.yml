# docker-compose.yml

services:

  # ---------------------------------------------------------------------
  # Telegram Connector – einziger extern erreichbarer Anwendungs-Container
  # ---------------------------------------------------------------------
  telegram-connector:
    build:
      context: .
      dockerfile: telegram-connector-v2/Dockerfile

    container_name: telegram-connector
    restart: unless-stopped

    depends_on:
      telegram-connector-db:
        condition: service_healthy

    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://telegram-connector-db:5432/telegram_connector
      SPRING_DATASOURCE_USERNAME: ${TELEGRAM_CONNECTOR_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${TELEGRAM_CONNECTOR_DB_PASSWORD}

      # Interne Kommunikation mit Agent Runtime
      TELEGRAM_CONNECTOR_AGENT_RUNTIME_BASE_URL: http://agent-runtime:8080

      # Öffentliche URL des Telegram Connectors
      TELEGRAM_CONNECTOR_PUBLIC_BASE_URL: ${PUBLIC_DOMAIN}
      TELEGRAM_CONNECTOR_CALLBACK_BASE_URL: http://telegram-connector:8080
      CONNECTOR_CALLBACK_TOKEN: ${CONNECTOR_CALLBACK_TOKEN}
      TOOLS_FILES_PATH: /app/data/files

    expose:
      - "8080"

    networks:
      - agent-network
      - traefik-public

    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.telegram-connector.rule=Host(`${TRAEFIK_HOST}`)"
      - "traefik.http.routers.telegram-connector.entrypoints=websecure"
      - "traefik.http.routers.telegram-connector.tls.certresolver=letsencrypt"
      - "traefik.http.services.telegram-connector.loadbalancer.server.port=8080"


  # ---------------------------------------------------------------------
  # Agent Runtime – nur intern erreichbar
  # ---------------------------------------------------------------------
  agent-runtime:
    build:
      context: .
      dockerfile: agent-runtime/Dockerfile

    container_name: agent-runtime
    restart: unless-stopped

    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}

      # Interne Kommunikation mit Telegram Connector
      CALLBACK_ALLOWED_BASE_URL: http://telegram-connector:8080
      CONNECTOR_CALLBACK_TOKEN: ${CONNECTOR_CALLBACK_TOKEN}

    expose:
      - "8080"

    # Persistente SQLite-Datenbank:
    # jdbc:sqlite:./data/agent-runtime.db
    # entspricht im Container /app/data/agent-runtime.db
    volumes:
      - agent-runtime-data:/app/data

    networks:
      - agent-network


  # ---------------------------------------------------------------------
  # PostgreSQL für Telegram Connector – ausschließlich intern
  # ---------------------------------------------------------------------
  telegram-connector-db:
    image: postgres:16-alpine

    container_name: telegram-connector-db
    restart: unless-stopped

    environment:
      POSTGRES_DB: telegram_connector
      POSTGRES_USER: ${TELEGRAM_CONNECTOR_DB_USER}
      POSTGRES_PASSWORD: ${TELEGRAM_CONNECTOR_DB_PASSWORD}

    volumes:
      - telegram-connector-db-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${TELEGRAM_CONNECTOR_DB_USER} -d telegram_connector"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

    networks:
      - agent-network


# -----------------------------------------------------------------------
# Netzwerke
# -----------------------------------------------------------------------
networks:

  # Internes Netzwerk für Kommunikation zwischen den Services
  agent-network:
    driver: bridge

  # Externes Netzwerk des separaten Traefik-Stacks
  traefik-public:
    external: true


# -----------------------------------------------------------------------
# Persistente Daten
# -----------------------------------------------------------------------
volumes:

  # PostgreSQL-Daten des Telegram Connectors
  telegram-connector-db-data:

  # SQLite-Daten der Agent Runtime
  agent-runtime-data:
